<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0..1,0&amp;display=block" rel="stylesheet">
<style>body{margin:0;background:#fff;color:#111;font-family:"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:#111;text-decoration:none}a:hover{color:#6B6B6B}*{box-sizing:border-box}</style>
</helmet>
<div style="background:#fff;font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:#111">
  <div style="height:36px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;gap:24px;font-size:12px;line-height:16px;font-weight:500">
    <span style="font-family:'Material Symbols Outlined';font-size:18px;line-height:1;font-feature-settings:'liga';font-variation-settings:'wght' 300;cursor:pointer">chevron_left</span>
    <span>Gratis ongkir min. belanja Rp300.000</span>
    <span style="font-family:'Material Symbols Outlined';font-size:18px;line-height:1;font-feature-settings:'liga';font-variation-settings:'wght' 300;cursor:pointer">chevron_right</span>
  </div>
  <div style="border-bottom:1px solid #E3E3E3;background:#fff">
    <header style="max-width:1440px;margin:0 auto;height:64px;padding:0 40px;display:flex;align-items:center;gap:clamp(16px,3vw,48px)">
      <a href="Homepage.dc.html" style="display:flex;align-items:center;gap:10px;color:#111;flex:none">
        <img src="assets/logo-black.png" alt="Aone" style="height:28px;width:auto;display:block">
        <span style="font-size:20px;font-weight:700;letter-spacing:.14em">AONE</span>
      </a>
      <nav style="display:flex;gap:clamp(16px,2.2vw,32px);height:64px;flex:none">
        <sc-for list="{{ navs }}" as="n" hint-placeholder-count="3">
          <a href="Kategori PLP.dc.html" style="position:relative;height:64px;display:flex;align-items:center;font-size:14px;font-weight:700;letter-spacing:.04em;color:#111">{{ n.label }}<sc-if value="{{ n.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#111"></span></sc-if></a>
        </sc-for>
      </nav>
      <div style="flex:1"></div>
      <a href="Search.dc.html" style="width:420px;min-width:0;flex-shrink:1;height:40px;background:#F4F4F4;display:flex;align-items:center;gap:10px;padding:0 14px;color:#6B6B6B;font-size:14px">
        <span style="font-family:'Material Symbols Outlined';font-size:22px;line-height:1;font-feature-settings:'liga';font-variation-settings:'wght' 300;color:#111">search</span>
        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Cari kaos, kemeja, celana…</span>
      </a>
      <div style="display:flex;align-items:center;gap:4px;flex:none">
        <a href="Wishlist.dc.html" aria-label="Wishlist" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:24px;line-height:1;font-feature-settings:'liga';font-variation-settings:'wght' 300">favorite</a>
        <a href="Profil.dc.html" aria-label="Akun" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-family:'Material Symbols Outlined';font-size:24px;line-height:1;font-feature-settings:'liga';font-variation-settings:'wght' 300">person</a>
        <a href="Keranjang.dc.html" aria-label="Keranjang" style="position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#111">
          <span style="font-family:'Material Symbols Outlined';font-size:24px;line-height:1;font-feature-settings:'liga';font-variation-settings:'wght' 300">shopping_bag</span>
          <sc-if value="{{ hasCart }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;top:6px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#111;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif">{{ cartCount }}</span></sc-if>
        </a>
      </div>
    </header>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;WANITA&quot;,&quot;PRIA&quot;,&quot;ANAK&quot;],&quot;default&quot;:&quot;WANITA&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:99}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'WANITA';
    const cartCount = this.props.cartCount ?? 2;
    return {
      navs: ['WANITA', 'PRIA', 'ANAK'].map(l => ({ label: l, on: l === active })),
      cartCount, hasCart: cartCount > 0
    };
  }
}
</script>
</body>
</html>
