<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0..1,0&amp;display=block" rel="stylesheet">
<style>body{margin:0;background:#fff;color:#111;font-family:"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:#111;text-decoration:none}a:hover{color:#6B6B6B}*{box-sizing:border-box}</style>
</helmet>
<div style="font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:#111;background:#fff" data-screen-label="404">
  <dc-import name="Aone Header" active="" cart-count="{{ two }}" hint-size="100%,101px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>

  <div style="max-width:1440px;margin:0 auto;padding:96px 40px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:end">
    <div style="display:flex;flex-direction:column;gap:20px">
      <span style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:.08em;color:#6B6B6B">ERROR 404</span>
      <h1 style="margin:0;font-size:56px;line-height:62px;font-weight:700;text-wrap:balance">Halaman ini tidak ditemukan</h1>
      <p style="margin:0;font-size:16px;line-height:24px;max-width:480px">Tautannya mungkin sudah kedaluwarsa atau produknya sudah tidak dijual. Coba cari lagi, atau mulai dari salah satu kategori di bawah.</p>
      <div style="display:flex;gap:12px;margin-top:8px">
        <a href="Homepage.dc.html" style="height:48px;padding:0 32px;background:#111;color:#fff;display:flex;align-items:center;font-size:14px;font-weight:700;letter-spacing:.04em">KE BERANDA</a>
        <a href="Bantuan.dc.html" style="height:48px;padding:0 32px;border:1px solid #111;display:flex;align-items:center;font-size:14px;font-weight:700;letter-spacing:.04em">PUSAT BANTUAN</a>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px">
      <a href="Search.dc.html" style="height:56px;border:1px solid #111;display:flex;align-items:center;gap:12px;padding:0 16px;color:#6B6B6B;font-size:16px">
        <span style="font-family:'Material Symbols Outlined';font-size:24px;line-height:1;font-feature-settings:'liga';font-variation-settings:'wght' 300;color:#111">search</span>Cari produk</a>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
          <a href="Kategori PLP.dc.html" style="height:36px;padding:0 14px;border:1px solid #E3E3E3;display:flex;align-items:center;font-size:13px">{{ c }}</a>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="max-width:1440px;margin:0 auto;padding:96px 40px 0;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;align-items:center;gap:16px">
      <h2 style="margin:0;font-size:28px;line-height:36px;font-weight:700;flex:1">Terlaris minggu ini</h2>
      <a href="Kategori PLP.dc.html" style="font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:4px">Lihat semua</a>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px;row-gap:40px">
      <sc-for list="{{ recs }}" as="id" hint-placeholder-count="4">
        <dc-import name="Product Card" pid="{{ id }}" hint-size="100%,520px"></dc-import>
      </sc-for>
    </div>
  </div>

  <div style="height:96px"></div>
  <dc-import name="Aone Footer" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      two: 2,
      cats: ['Wanita', 'Pria', 'Anak', 'Kemeja & Blus', 'Celana', 'Outer & Jaket', 'Sale'],
      recs: [8, 4, 0, 1]
    };
  }
}
</script>
</body>
</html>
